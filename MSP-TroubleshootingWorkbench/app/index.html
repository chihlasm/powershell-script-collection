<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MSP Troubleshooting Workbench</title>
  <style>
    :root {
      color-scheme: dark light;
      --bg: #10151c;
      --panel: #171f29;
      --panel-border: #2a3746;
      --text: #edf3f8;
      --muted: #9fb0bf;
      --accent: #5dade2;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
      line-height: 1.5;
    }

    main {
      width: min(960px, calc(100% - 32px));
      margin: 0 auto;
      padding: 40px 0;
    }

    h1 {
      margin: 0 0 24px;
      font-size: 2rem;
      font-weight: 700;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 1.05rem;
      font-weight: 650;
    }

    section {
      margin-bottom: 18px;
      padding: 18px;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      background: var(--panel);
    }

    dl {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 8px 16px;
      margin: 0;
    }

    dt {
      color: var(--muted);
    }

    dd {
      margin: 0;
      word-break: break-word;
    }

    .empty {
      margin: 0;
      color: var(--muted);
    }

    .status-line {
      margin: 0;
      color: var(--accent);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f7fa;
        --panel: #ffffff;
        --panel-border: #cfd8e3;
        --text: #16202a;
        --muted: #526273;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>MSP Troubleshooting Workbench</h1>

    <section aria-labelledby="backend-status-title">
      <h2 id="backend-status-title">Backend status</h2>
      <p id="status-loading" class="status-line">Loading backend status...</p>
      <dl id="backend-status" hidden>
        <dt>App</dt>
        <dd id="status-app-name"></dd>
        <dt>Version</dt>
        <dd id="status-version"></dd>
        <dt>Port</dt>
        <dd id="status-port"></dd>
        <dt>Output path</dt>
        <dd id="status-output-path"></dd>
      </dl>
    </section>

    <section aria-labelledby="case-list-title">
      <h2 id="case-list-title">Cases</h2>
      <p id="cases-empty" class="empty">No cases yet.</p>
    </section>
  </main>

  <script>
    async function loadStatus() {
      const loading = document.getElementById("status-loading");
      const status = document.getElementById("backend-status");

      try {
        const response = await fetch("/api/status");
        if (!response.ok) {
          throw new Error("Status request failed");
        }

        const data = await response.json();
        document.getElementById("status-app-name").textContent = data.appName || "";
        document.getElementById("status-version").textContent = data.version || "";
        document.getElementById("status-port").textContent = data.port || "";
        document.getElementById("status-output-path").textContent = data.outputPath || "";
        loading.hidden = true;
        status.hidden = false;
      }
      catch (error) {
        loading.textContent = "Backend status unavailable.";
      }
    }

    async function loadCases() {
      const empty = document.getElementById("cases-empty");

      try {
        const response = await fetch("/api/cases");
        if (!response.ok) {
          throw new Error("Cases request failed");
        }

        const cases = await response.json();
        empty.textContent = cases.length === 0 ? "No cases yet." : "";
      }
      catch (error) {
        empty.textContent = "Case list unavailable.";
      }
    }

    loadStatus();
    loadCases();
  </script>
</body>
</html>
