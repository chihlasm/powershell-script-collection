<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DiskSpd Diagnostic Report — {{TARGET}}</title>
<style>
  :root { color-scheme: dark; }
  body { background: #1e1e1e; color: #eaeaea; font-family: Segoe UI, system-ui, sans-serif; margin: 0; padding: 24px; }
  h1 { margin: 0 0 4px; font-weight: 600; letter-spacing: -0.5px; }
  h2 { margin: 0 0 12px; font-size: 1.1rem; font-weight: 600; color: #d4d4d4; }
  .sub { color: #9aa0a6; font-size: 0.9rem; }
  .accent { color: #5dade2; }
  .card { background: #252526; border: 1px solid #333; border-radius: 6px; padding: 16px 20px; margin: 16px 0; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #333; }
  th { color: #9aa0a6; font-weight: 500; }
  .num { font-family: Consolas, monospace; text-align: right; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 0.8rem; font-weight: 600; margin-right: 6px; }
  .ok   { background: #1f4d2a; color: #7ee695; }
  .warn { background: #5a4416; color: #ffd58a; }
  .crit { background: #5a1f1f; color: #ff8a8a; }
  details { margin-top: 24px; }
  summary { cursor: pointer; color: #9aa0a6; padding: 8px 0; }
  pre { background: #111; padding: 12px; overflow-x: auto; border-radius: 4px; font-size: 0.8rem; color: #c8c8c8; }
</style>
</head>
<body>
  <h1>DiskSpd Diagnostic Report</h1>
  <div class="sub">Target: <span class="accent">{{TARGET}}</span> &middot; Workload: <span class="accent">{{PROFILE}}</span> &middot; Run at <span class="accent">{{TIMESTAMP}}</span></div>

  <div class="card">
    <h2>Results</h2>
    <table>
      <thead><tr><th>Metric</th><th class="num">Value</th><th>Status</th></tr></thead>
      <tbody>
        {{RESULTS_TABLE}}
      </tbody>
    </table>
  </div>

  <div class="card">
    <h2>Health Assessment</h2>
    {{HEALTH_BADGES}}
  </div>

  <details>
    <summary>Raw diskspd XML output</summary>
    <pre>{{RAW_XML}}</pre>
  </details>
</body>
</html>
